server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # --- Сжатие (главный прирост скорости для HTML) ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # text/html сжимается всегда при gzip on

    # --- Статика: долгий иммутабельный кэш (шрифты, картинки, иконки) ---
    # Шрифты не меняются (split по unicode-range) — можно кэшировать надолго, immutable
    location ~* \.(?:woff2|woff|ttf|otf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Картинки/иконки могут обновляться под тем же именем (og-image, фото, favicon):
    # кэш 1 день, БЕЗ immutable — иначе посетитель месяц видит старую версию
    location ~* \.(?:png|webp|jpe?g|gif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
    }

    # --- PDF: кэш поменьше (резюме может обновляться) ---
    location ~* \.pdf$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";
    }

    # --- token.json: НЕ кэшировать (cron обновляет каждые 50 мин), volume-монтирование ---
    location = /token.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # --- HTML и всё остальное: честный 404, без кэша ---
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
